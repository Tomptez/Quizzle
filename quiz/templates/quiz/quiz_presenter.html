{% extends "quiz/quiz_base.html" %}
{% block head %}
  <title>Presenter view - {{ quiz.name }}</title>
{% endblock %}

{% block content %}

<div class="container-fluid py-3">
  <div class="g-4 row justify-content-center my-4">

    <div class="col-6">
      <div class="quiz-container">
        <div id="statusBanner" class="alert alert-info mb-3">Waiting to start — click <strong>Start Quiz</strong> to show the first question.
        </div>
        <div id="scoreboardContainer"></div>
        <h1 id="quizName">{{ quiz.name }}</h1>

        <div class="progress-bar-section" id="progressSection" style="display:none;">
          <div class="d-flex justify-content-between mb-2">
            <span id="progressText">Question 1 of 0</span>
          </div>
          <div class="progress">
            <div id="progressBar" class="progress-bar" style="width: 0%"></div>
          </div>
        </div>

        <div id="questionsContainer" class="mt-3"></div>

        <div class="mt-4 d-flex">
          <button id="advanceBtn" class="btn btn-success btn-lg" onclick="advanceQuestion()">
            Start Quiz
          </button>
        </div>
      </div>
    </div>
</div>
  <div class="g-4 row justify-content-center my-4">
    <div class="col-6">
      <div class="card shadow-sm presenter-sidebar">
        <div class="card-header bg-primary text-white">
          <h5 class="mb-0">Session</h5>
        </div>
        <div class="card-body text-center">
          <p class="mb-1 text-muted small">Participants join at:</p>
          <div id="joinUrlContainer" class="d-flex align-items-center justify-content-center mb-3 fs-2">
          </div>

          <div class="border rounded p-2 bg-light mb-3">
            <p class="mb-1 small text-muted">Session code</p>
            <h4 class="mb-0 fw-bold fs-1" id="sessionCode">{{ public_id }}</h4>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
    const quizData = {{ quiz|safe }};
    const adminId = "{{ admin_id }}";
    const publicId = "{{ public_id }}";
    const joinUrl = window.location.origin + "/quiz/" + quizData.public_id;
    let currentQuestionIndex = -1;
    const totalQuestions = quizData.questions.length;

    document.getElementById('quizName').textContent = quizData.name;
    document.getElementById("joinUrlContainer").innerHTML = joinUrl;

     function renderQuestion() {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        if (currentQuestionIndex < 0) return;

        const question = quizData.questions[currentQuestionIndex];
        const answersHtml = question.answers.map((answer, i) =>
            `<button class="answer-button">${i + 1}. ${answer.text}</button>`
        ).join('');

        container.innerHTML = `
            <div class="question-display active">
                <h3>${question.text}</h3>
                <div class="mt-3 answers-container">${answersHtml}</div>
            </div>`;
    }

    function updateProgress() {
        document.getElementById('progressText').textContent =
            `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
        document.getElementById('progressBar').style.width =
            `${((currentQuestionIndex + 1) / totalQuestions) * 100}%`;
    }

    function updateAdvanceBtn() {
        const btn = document.getElementById('advanceBtn');
        if (currentQuestionIndex < 0) {
            btn.innerHTML = '<i class="bi bi-play-fill"></i> Start Quiz';
        } else if (currentQuestionIndex >= totalQuestions - 1) {
            btn.innerHTML = '<i class="bi bi-flag-fill"></i> End Quiz';
        } else {
            btn.innerHTML = '<i class="bi bi-skip-forward-fill"></i> Next Question';
        }
    }

    async function advanceQuestion() {
        document.getElementById('advanceBtn').disabled = true;

        const response = await fetch('/quiz/api/advance-guided-question', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({ admin_id: adminId })
        });
        const data = await response.json();

        if (data.status === 'ended') {
          window.location.href = "{% url 'scoreboard' public_id=public_id %}";
        } else if (data.status === 'success') {
            currentQuestionIndex = data.question_index;
            document.getElementById('statusBanner').className = 'alert alert-success mb-3';
            document.getElementById('statusBanner').textContent =
                `Showing question ${currentQuestionIndex + 1} of ${totalQuestions}`;
            document.getElementById('progressSection').style.display = 'block';
            renderQuestion();
            updateProgress();
            updateAdvanceBtn();
            document.getElementById('advanceBtn').disabled = false;
        }
    }
</script>
{% endblock %}
